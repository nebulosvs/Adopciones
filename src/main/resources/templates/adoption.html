<!DOCTYPE html>
<html>
<head>
    <title>Adopción</title>
</head>
<body>

<h2>Formulario de Adopción</h2>

<form id="adoptionForm">
    <input type="text" id="name" placeholder="Nombre" required><br>
    <input type="email" id="email" placeholder="Email" required><br>
    <textarea id="message" placeholder="Mensaje"></textarea><br>
    <button type="submit">Enviar</button>
</form>

<script>
document.getElementById("adoptionForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const response = await fetch("/adoption", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            applicantName: document.getElementById("name").value,
            email: document.getElementById("email").value,
            message: document.getElementById("message").value
        })
    });

    if (response.ok) {
        alert("Solicitud enviada");
    } else {
        alert("Error");
    }
});
</script>

</body>
</html>
