version: '3.8'

services:
  mysql-cdy2203:
    image: mysql:8.0
    container_name: mysql-cdy2203
    restart: always
    environment:
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: backend-cdy2203
    depends_on:
      - mysql-cdy2203
    ports:
      - "8180:8180"

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-cdy2203
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-cdy2203
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./:/workspace
    depends_on:
      - sonarqube
  
  openvas:
    image: immauss/openvas
    container_name: openvas-cdy2203
    ports:
      - "9392:9392"
    environment:
      - PASSWORD=admin
    volumes:
      - openvas_data:/data

volumes:
  mysql_data:
  sonarqube_data:
  jenkins_home:
  openvas_data: